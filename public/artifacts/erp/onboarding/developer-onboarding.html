<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Developer Onboarding</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #e2e5ea;
    --accent: #2f6feb;
    --done: #1a9e6b;
    --track: #e2e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f26;
      --text: #e8eaf0;
      --muted: #9aa1b0;
      --border: #2b2f38;
      --accent: #6ea1ff;
      --done: #4fd39a;
      --track: #2b2f38;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
    max-width: 640px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
  }
  .progress-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .progress-count { font-weight: 600; }
  .bar-track {
    height: 10px;
    background: var(--track);
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .bar-fill {
    height: 100%;
    background: var(--done);
    border-radius: 5px;
    width: 0%;
    transition: width 0.2s ease;
  }
  .group-title {
    color: var(--muted);
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 18px 0 8px;
  }
  .group-title:first-of-type { margin-top: 0; }
  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 4px;
    border-radius: 6px;
    cursor: pointer;
  }
  .item:hover { background: var(--track); }
  .checkbox {
    flex: 0 0 18px;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--border);
    border-radius: 4px;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
  }
  .item.checked .checkbox { background: var(--done); border-color: var(--done); }
  .item.checked .label { color: var(--muted); text-decoration: line-through; }
  .label { font-size: 0.92rem; }
  .reset-row { margin-top: 16px; text-align: right; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
  }
</style>
</head>
<body>
  <h1>Developer Onboarding</h1>
  <p class="sub">ERP &middot; first-week checklist (in-memory demo — nothing is saved)</p>

  <div class="panel">
    <div class="progress-header">
      <span>Onboarding progress</span>
      <span class="progress-count"><span id="done-count">0</span> of <span id="total-count">0</span> complete</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="progress-bar"></div></div>

    <div id="checklist"></div>

    <div class="reset-row">
      <button id="reset-btn">Reset checklist</button>
    </div>
  </div>

  <script>
    (function () {
      var groups = [
        {
          title: 'Access & accounts',
          items: [
            'Request VPN and internal network access',
            'Set up SSO for email and calendar',
            'Get added to the engineering team channel',
          ],
        },
        {
          title: 'Local setup',
          items: [
            'Clone the ERP monorepo',
            'Install the toolchain (runtime, package manager, linters)',
            'Run the app locally and confirm it starts',
            'Run the test suite once with no failures',
          ],
        },
        {
          title: 'First contributions',
          items: [
            'Read the architecture overview doc',
            'Pick up a starter ticket from the backlog',
            'Open a first pull request and get it reviewed',
          ],
        },
      ];

      var checklistEl = document.getElementById('checklist');
      var doneCountEl = document.getElementById('done-count');
      var totalCountEl = document.getElementById('total-count');
      var progressBar = document.getElementById('progress-bar');

      var state = [];

      function build() {
        checklistEl.innerHTML = '';
        state = [];
        groups.forEach(function (group) {
          var heading = document.createElement('div');
          heading.className = 'group-title';
          heading.textContent = group.title;
          checklistEl.appendChild(heading);

          group.items.forEach(function (text) {
            var item = document.createElement('div');
            item.className = 'item';

            var box = document.createElement('div');
            box.className = 'checkbox';

            var label = document.createElement('div');
            label.className = 'label';
            label.textContent = text;

            item.appendChild(box);
            item.appendChild(label);
            checklistEl.appendChild(item);

            var entry = { el: item, checked: false };
            state.push(entry);

            item.addEventListener('click', function () {
              entry.checked = !entry.checked;
              item.classList.toggle('checked', entry.checked);
              box.textContent = entry.checked ? '✓' : '';
              update();
            });
          });
        });
        update();
      }

      function update() {
        var total = state.length;
        var done = state.filter(function (s) { return s.checked; }).length;
        doneCountEl.textContent = done;
        totalCountEl.textContent = total;
        progressBar.style.width = (total === 0 ? 0 : (done / total) * 100) + '%';
      }

      document.getElementById('reset-btn').addEventListener('click', build);

      build();
    })();
  </script>
</body>
</html>
