<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafana Alert Catalog</title>
<meta name="description" content="Grafana alerting catalog and runbook index: what alerts exist, why they fire, who owns them, where they notify, and what to do. SAMPLE DATA.">
<style>
/* ============================================================
   Theme tokens
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #f4f5f8;
  --panel: #ffffff;
  --panel-2: #f7f8fa;
  --border: #dcdee6;
  --border-strong: #c3c7d1;
  --text: #1d2130;
  --text-2: #4a5065;
  --text-3: #6e748a;
  --accent: #3d71d9;
  --accent-soft: #e6eefc;
  --focus: #3d71d9;

  --crit: #c4162a;
  --crit-bg: #c4162a;
  --crit-fg: #ffffff;
  --crit-soft: #fde8ea;
  --warn: #9a6100;
  --warn-bg: #fff4d6;
  --warn-border: #e0a526;
  --info: #2f5fb3;
  --info-bg: #eaf1fd;
  --ok: #1a7f45;
  --ok-bg: #e3f5ea;
  --muted-bg: #eceef3;
  --missing: #b3261e;
  --missing-bg: #fff0ee;
  --missing-border: #e8a39c;
  --partial: #8a5a00;
  --partial-bg: #fff6e0;

  --code-bg: #f3f4f8;
  --code-fg: #1d2130;
  --tk-fn: #7a3eb5;
  --tk-metric: #1f5fa8;
  --tk-label: #9a4f00;
  --tk-str: #1a7f45;
  --tk-num: #b3261e;
  --tk-kw: #c4162a;
  --tk-op: #4a5065;
  --tk-cmt: #6e748a;

  --shadow: 0 1px 2px rgba(20,24,40,.06), 0 2px 8px rgba(20,24,40,.05);
  --shadow-lg: -8px 0 32px rgba(20,24,40,.18);
  --radius: 6px;
  --mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
  --sans: Inter, "Segoe UI", Roboto, system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111217;
  --panel: #181b22;
  --panel-2: #1f232c;
  --border: #2c313c;
  --border-strong: #3d4351;
  --text: #e3e5ec;
  --text-2: #b4b9c7;
  --text-3: #8b91a3;
  --accent: #6e9fff;
  --accent-soft: #1c2a45;
  --focus: #6e9fff;

  --crit: #ff6b7a;
  --crit-bg: #d4283a;
  --crit-fg: #ffffff;
  --crit-soft: #3a1a20;
  --warn: #f5c04e;
  --warn-bg: #3a2e12;
  --warn-border: #b8861c;
  --info: #8fb4ff;
  --info-bg: #1b2740;
  --ok: #5fd08e;
  --ok-bg: #16301f;
  --muted-bg: #262a34;
  --missing: #ff8a80;
  --missing-bg: #3a1b19;
  --missing-border: #7a3530;
  --partial: #f5c04e;
  --partial-bg: #33290f;

  --code-bg: #0d0f14;
  --code-fg: #d9dce5;
  --tk-fn: #c792ea;
  --tk-metric: #82aaff;
  --tk-label: #f0a45d;
  --tk-str: #a5d68a;
  --tk-num: #ff8a80;
  --tk-kw: #ff7a8a;
  --tk-op: #9aa1b3;
  --tk-cmt: #7b8296;

  --shadow: 0 1px 2px rgba(0,0,0,.4);
  --shadow-lg: -8px 0 32px rgba(0,0,0,.5);
}

/* ============================================================
   Base
   ============================================================ */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ============================================================
   Top bar & nav
   ============================================================ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
}
.topbar-inner {
  max-width: 1640px; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; gap: 20px; height: 56px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand svg { color: #f46800; }
.brand small { font-weight: 500; color: var(--text-3); }
nav.tabs { display: flex; gap: 2px; height: 100%; }
nav.tabs a {
  display: flex; align-items: center; gap: 6px; padding: 0 12px;
  color: var(--text-2); text-decoration: none; font-weight: 500;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
nav.tabs a:hover { color: var(--text); }
nav.tabs a[aria-current="page"] { color: var(--text); border-bottom-color: #f46800; }
nav.tabs .count { font-size: 11px; background: var(--muted-bg); color: var(--text-2); border-radius: 9px; padding: 0 6px; }
nav.tabs .count.bad { background: var(--missing-bg); color: var(--missing); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.search {
  position: relative; display: flex; align-items: center;
}
.search svg { position: absolute; left: 9px; color: var(--text-3); pointer-events: none; }
.search input {
  width: 300px; height: 34px; padding: 0 30px 0 32px;
  background: var(--panel-2); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius);
  font: inherit;
}
.search input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.search kbd { position: absolute; right: 8px; font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 34px; min-width: 34px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); cursor: pointer; color: var(--text-2);
}
.icon-btn:hover { background: var(--panel-2); color: var(--text); }

.sample-banner {
  max-width: 1640px; margin: 12px auto 0; padding: 0 20px;
}
.sample-banner div {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px dashed var(--warn-border); background: var(--warn-bg); color: var(--text);
  border-radius: var(--radius); padding: 8px 12px; font-size: 13px;
}
.sample-banner strong { color: var(--warn); }

main { max-width: 1640px; margin: 0 auto; padding: 16px 20px 60px; }
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 4px 0 14px; }
.view-head h1 { font-size: 20px; font-weight: 600; }
.view-head p { margin: 4px 0 0; color: var(--text-2); max-width: 900px; }

/* ============================================================
   Panels, cards, grids
   ============================================================ */
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.panel-head h2 { font-size: 14px; font-weight: 600; }
.panel-head .hint { color: var(--text-3); font-size: 12px; }
.panel-body { padding: 14px 16px; }

.stat-grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
@media (max-width: 1500px) { .stat-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
.stat {
  text-align: left; cursor: pointer; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); border-top: 3px solid var(--border-strong);
}
.stat:hover { border-color: var(--accent); }
.stat .label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); font-weight: 500; }
.stat .value { font-size: 26px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 11.5px; color: var(--text-3); }
.stat.crit { border-top-color: var(--crit-bg); }
.stat.crit .value { color: var(--crit); }
.stat.warn { border-top-color: var(--warn-border); }
.stat.info { border-top-color: var(--info); }
.stat.ok { border-top-color: var(--ok); }
.stat.bad { border-top-color: var(--missing); }
.stat.bad .value { color: var(--missing); }
.stat.zero .value { color: var(--text-3); }

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1280px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stack { display: grid; gap: 16px; }

/* Horizontal bar charts (HTML, accessible) */
.bars { display: grid; gap: 6px; }
.bar-row {
  display: grid; grid-template-columns: 170px 1fr 36px; gap: 10px; align-items: center;
  background: none; border: 0; padding: 3px 4px; border-radius: 4px; cursor: pointer; text-align: left; width: 100%;
}
.bar-row:hover { background: var(--panel-2); }
.bar-row .bl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-2); font-size: 13px; }
.bar-row .bl.bad { color: var(--missing); font-weight: 600; }
.bar-row .bn { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.track { display: flex; height: 16px; background: var(--muted-bg); border-radius: 3px; overflow: hidden; }
.seg { height: 100%; min-width: 2px; }
.seg + .seg { border-left: 2px solid var(--panel); }
.seg.critical { background: var(--crit-bg); }
.seg.warning { background: var(--warn-border); }
.seg.info { background: var(--info); opacity: .75; }
.seg.complete { background: var(--ok); }
.seg.partial { background: var(--warn-border); }
.seg.missing { background: var(--missing); }
.seg.unknown { background: var(--text-3); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* ============================================================
   Badges
   ============================================================ */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 11px;
  font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1;
  border: 1px solid transparent;
}
.badge svg { flex: none; }
.sev-critical { background: var(--crit-bg); color: var(--crit-fg); }
.sev-warning { background: var(--warn-bg); color: var(--warn); border-color: var(--warn-border); }
.sev-info { background: var(--info-bg); color: var(--info); font-weight: 500; }
.sev-unknown { background: var(--missing-bg); color: var(--missing); border: 1px dashed var(--missing-border); }
.st-enabled { background: var(--ok-bg); color: var(--ok); font-weight: 500; }
.st-disabled { background: var(--muted-bg); color: var(--text-3); font-weight: 500; text-decoration: line-through; text-decoration-thickness: 1px; }
.doc-complete { background: var(--ok-bg); color: var(--ok); font-weight: 500; }
.doc-partial { background: var(--partial-bg); color: var(--partial); font-weight: 500; }
.doc-missing { background: var(--missing-bg); color: var(--missing); border-color: var(--missing-border); }
.tag { background: var(--muted-bg); color: var(--text-2); font-weight: 500; border-radius: 4px; }
.gap-badge { background: var(--missing-bg); color: var(--missing); border: 1px dashed var(--missing-border); border-radius: 4px; }
.missing-val {
  display: inline-flex; align-items: center; gap: 5px; color: var(--missing); font-weight: 600;
  background: var(--missing-bg); border: 1px dashed var(--missing-border); border-radius: 4px; padding: 1px 7px; font-size: 12.5px;
}

/* ============================================================
   Filters
   ============================================================ */
.filterbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.ms { position: relative; }
.ms > summary {
  list-style: none; cursor: pointer; user-select: none;
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text-2); font-size: 13px;
}
.ms > summary::-webkit-details-marker { display: none; }
.ms > summary:hover { border-color: var(--border-strong); color: var(--text); }
.ms.active > summary { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.ms-pop {
  position: absolute; top: 36px; left: 0; z-index: 20; min-width: 240px; max-height: 340px; overflow: auto;
  background: var(--panel); border: 1px solid var(--border-strong); border-radius: var(--radius); box-shadow: var(--shadow); padding: 6px;
}
.ms-pop label { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.ms-pop label:hover { background: var(--panel-2); }
.ms-pop label .n { margin-left: auto; color: var(--text-3); font-variant-numeric: tabular-nums; font-size: 12px; }
.ms-pop .none { color: var(--missing); font-style: italic; }
.ms-pop .ms-actions { display: flex; justify-content: space-between; border-top: 1px solid var(--border); margin-top: 4px; padding: 6px 4px 2px; }
.link-btn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 4px; font-size: 12.5px; }
.link-btn:hover { text-decoration: underline; }
.clear-btn { height: 32px; }
.result-meta { margin-left: auto; color: var(--text-3); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 4px 0 9px;
  background: var(--accent-soft); color: var(--accent); border-radius: 12px; font-size: 12px; font-weight: 500;
}
.chip button { background: none; border: 0; cursor: pointer; color: inherit; width: 18px; height: 18px; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; }
.chip button:hover { background: rgba(0,0,0,.08); }

/* ============================================================
   Alerts table
   ============================================================ */
.table-wrap { overflow-x: auto; }
table.alerts { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
table.alerts th {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel-2); color: var(--text-2); font-weight: 600; font-size: 12px; text-align: left;
  padding: 0; border-bottom: 1px solid var(--border); white-space: nowrap;
}
table.alerts th button {
  display: flex; align-items: center; gap: 4px; width: 100%; background: none; border: 0; padding: 9px 10px; cursor: pointer; color: inherit; font: inherit;
}
table.alerts th button:hover { color: var(--text); }
table.alerts th .sort { opacity: .35; }
table.alerts th[aria-sort="ascending"] .sort, table.alerts th[aria-sort="descending"] .sort { opacity: 1; color: var(--accent); }
table.alerts td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; white-space: nowrap; }
table.alerts tr.row { cursor: pointer; }
table.alerts tr.row:hover td { background: var(--panel-2); }
table.alerts tr.row.is-disabled td { color: var(--text-3); }
table.alerts tr.row.is-open td { background: var(--accent-soft); }
table.alerts tr.row td:first-child { box-shadow: inset 3px 0 0 transparent; }
table.alerts tr.row.sev-row-critical td:first-child { box-shadow: inset 4px 0 0 var(--crit-bg); }
table.alerts tr.row.sev-row-warning td:first-child { box-shadow: inset 3px 0 0 var(--warn-border); }
table.alerts tr.row.sev-row-info td:first-child { box-shadow: inset 2px 0 0 var(--info); }
.name-cell { display: flex; flex-direction: column; gap: 1px; min-width: 220px; white-space: normal; }
.name-cell a { color: var(--text); font-weight: 600; text-decoration: none; }
.name-cell a:hover { color: var(--accent); text-decoration: underline; }
.name-cell .uid { font: 11px var(--mono); color: var(--text-3); }
.expander { background: none; border: 0; cursor: pointer; color: var(--text-3); width: 24px; height: 24px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; }
.expander:hover { background: var(--muted-bg); color: var(--text); }
.expander svg { transition: transform .12s; }
.expander[aria-expanded="true"] svg { transform: rotate(90deg); }
tr.expand-row td { background: var(--panel-2); white-space: normal; padding: 0; }
.expand-body { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 20px; padding: 14px 16px 16px 46px; }
.expand-body h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); margin-bottom: 4px; font-weight: 600; }
.expand-body p { margin: 0 0 10px; }
.empty { padding: 40px; text-align: center; color: var(--text-3); }

/* ============================================================
   Entity cards (services)
   ============================================================ */
.entity { display: flex; flex-direction: column; }
.entity .panel-head h2 { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.alert-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.alert-list li a {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; color: var(--text); text-decoration: none; font-size: 13px;
}
.alert-list li a:hover { background: var(--panel-2); }
.alert-list li a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-list li a.dis .nm { color: var(--text-3); text-decoration: line-through; }
.mini-sev { display: flex; gap: 6px; flex-wrap: wrap; }

/* ============================================================
   Health view
   ============================================================ */
table.matrix { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12.5px; }
table.matrix th, table.matrix td { border-bottom: 1px solid var(--border); padding: 6px 8px; text-align: center; white-space: nowrap; }
table.matrix th { background: var(--panel-2); color: var(--text-2); font-weight: 600; position: sticky; top: 0; }
table.matrix th.rot { height: 110px; vertical-align: bottom; padding-bottom: 8px; }
table.matrix th.rot span { writing-mode: vertical-rl; transform: rotate(180deg); display: inline-block; }
table.matrix td.nm, table.matrix th.nm { text-align: left; }
table.matrix td.nm a { color: var(--text); font-weight: 500; text-decoration: none; }
table.matrix td.nm a:hover { color: var(--accent); text-decoration: underline; }
.cell-ok { color: var(--ok); }
.cell-bad { color: var(--missing); background: var(--missing-bg); font-weight: 700; }
table.matrix tfoot td { font-weight: 600; color: var(--text-2); background: var(--panel-2); }
.debt-list { list-style: none; margin: 0; padding: 0; }
.debt-list li { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; flex-wrap: wrap; }
.debt-list li:last-child { border-bottom: 0; }
.debt-list li a { color: var(--text); font-weight: 500; }
.debt-list .why { color: var(--text-3); font-size: 12px; flex-basis: 100%; padding-left: 2px; }
.debt-card .panel-head h2 { display: flex; align-items: center; gap: 8px; }
.debt-card .cnt { font-size: 12px; border-radius: 10px; padding: 0 8px; background: var(--missing-bg); color: var(--missing); font-weight: 700; }
.debt-card .cnt.zero { background: var(--ok-bg); color: var(--ok); }
.all-good { color: var(--ok); font-size: 13px; display: flex; gap: 6px; align-items: center; }

/* ============================================================
   Drawer
   ============================================================ */
.scrim { position: fixed; inset: 0; background: rgba(10,12,20,.35); z-index: 40; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
  width: min(1000px, 78vw); background: var(--bg); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; border-left: 1px solid var(--border);
}
.drawer[hidden], .scrim[hidden] { display: none; }
.drawer-head { background: var(--panel); border-bottom: 1px solid var(--border); padding: 14px 20px 0; }
.drawer-title { display: flex; align-items: flex-start; gap: 12px; }
.drawer-title h2 { font-size: 19px; font-weight: 600; flex: 1; }
.drawer-title .actions { display: flex; gap: 6px; }
.drawer-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
.drawer-nav { display: flex; gap: 2px; overflow-x: auto; margin: 0 -4px; }
.drawer-nav a { padding: 7px 8px; font-size: 12.5px; color: var(--text-2); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
.drawer-nav a:hover { color: var(--text); border-bottom-color: var(--border-strong); }
.drawer-nav a.gap::after { content: " •"; color: var(--missing); }
.drawer-body { overflow-y: auto; padding: 16px 20px 60px; flex: 1; scroll-padding-top: 12px; }
.drawer-body section.sec { margin-bottom: 16px; }
.sec > .panel-head h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sec-num { font: 600 11px var(--mono); color: var(--text-3); background: var(--muted-bg); border-radius: 3px; padding: 1px 5px; }
.sec h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-3); font-weight: 600; margin: 14px 0 6px; }
.sec h4:first-child { margin-top: 0; }
.sec p { margin: 0 0 8px; }
.lead { font-size: 14.5px; color: var(--text); }
.sec ol, .sec ul { margin: 0; padding-left: 20px; }
.sec li { margin: 3px 0; }

/* Responder summary */

const SEVERITIES = ["critical", "warning", "info"];
const SEV_RANK = { critical: 0, warning: 1, info: 2, unknown: 3 };
const DOC_RANK = { missing: 0, partial: 1, complete: 2 };

/** Documentation a rule can carry in its own labels/annotations. Each missing one is listed by name. */
const DOC_REQUIREMENTS = [
  { key: "summary",      label: "Summary annotation",      test: a => has(a.summary) },
  { key: "impact",       label: "Impact",                  test: a => has(a.impact) },
  { key: "doNow",        label: "Do-now steps",            test: a => has(a.doNow) },
  { key: "resolvedWhen", label: "Resolved-when criteria",  test: a => has(a.resolvedWhen) },
  { key: "runbook",      label: "Runbook URL",             test: a => has(a.links?.runbook) },
  { key: "dashboard",    label: "Linked dashboard",        test: a => has(a.links?.dashboard) },
  { key: "severity",     label: "Severity label",          test: a => SEVERITIES.includes(a.severity) },
  { key: "service",      label: "Service label",           test: a => has(a.service) }
];

function docStatus(a) {
  const missing = DOC_REQUIREMENTS.filter(r => !r.test(a));
  let status = "complete";
  if (missing.length) {
    const guidance = ["impact", "doNow"].filter(k => missing.some(m => m.key === k)).length;
    status = (missing.length >= 4 || guidance === 2) ? "missing" : "partial";
  }
  return { status, missing, present: DOC_REQUIREMENTS.filter(r => r.test(a)) };
}

function severityIssue(a) {
  if (!has(a.labels?.severity)) return "Rule has no severity label";
  if (!SEVERITIES.includes(a.labels.severity)) return `Severity label "${a.labels.severity}" is not one of ${SEVERITIES.join(" / ")}`;
  return null;
}

/** All data queries of a rule (multi-query rules such as burn-rate SLOs have several). */
const queriesOf = a => a.queries || [];
function evaluatorText(e) {
  if (!e?.evaluator) return "";
  const op = { gt: ">", lt: "<", within_range: "within", outside_range: "outside" }[e.evaluator.type] || e.evaluator.type;
  return `${op} ${e.evaluator.params.join(" – ")}`;
}
/** The expression Grafana uses as the alert condition, rendered as text. */

  const exprs = a.expressions || [];

  if (c.type === "reduce") return `${c.reducer}(${c.expression})`;
  return c.expression || "";

/* PromQL / LogQL tokeniser, shared by syntax highlighting, metric extraction and duplicate detection. */
const Q_FUNCS = new Set("abs absent absent_over_time avg_over_time ceil changes clamp clamp_max clamp_min count_over_time day_of_month day_of_week delta deriv exp floor histogram_quantile holt_winters hour idelta increase irate label_join label_replace ln log2 log10 max_over_time min_over_time minute month predict_linear quantile_over_time rate resets round scalar sgn sort sort_desc sqrt stddev_over_time sum_over_time time timestamp vector year bytes_over_time bytes_rate first_over_time last_over_time rate_counter json logfmt regexp pattern unpack line_format label_format".split(" "));
const Q_AGGS = new Set("sum avg min max count stddev stdvar topk bottomk quantile count_values group".split(" "));
const Q_KWS = new Set("by without on ignoring group_left group_right and or unless offset bool".split(" "));

function tokenize(src) {
  const re = /("(?:\\.|[^"\\])*"|`[^`]*`)|(#[^\n]*)|(\d+(?:\.\d+)?(?:ms|s|m|h|d|w|y)?(?![A-Za-z_]))|([A-Za-z_:][A-Za-z0-9_:]*)|(=~|!~|!=|==|>=|<=|\|=|\|~|[-+*/%^<>=|!])|([{}()\[\],])|(\s+)|(.)/g;
  const out = [];
  let depth = 0, m;
  while ((m = re.exec(src))) {
    const [t, str, cmt, num, ident, op, punct] = m;
    if (str) out.push({ t, k: "str" });
    else if (cmt) out.push({ t, k: "cmt" });
    else if (num) out.push({ t, k: "num" });
    else if (ident) {
      const rest = src.slice(re.lastIndex);
      let k;
      if (depth > 0 && /^\s*(=~|!~|!=|=)/.test(rest)) k = "label";
      else if (Q_KWS.has(ident)) k = "kw";
      else if (Q_AGGS.has(ident) && /^\s*(\(|by\b|without\b)/.test(rest)) k = "fn";
      else if (Q_FUNCS.has(ident) && /^\s*\(/.test(rest)) k = "fn";
      else if (depth === 0 && /^\s*\(/.test(rest)) k = "fn";
      else if (depth > 0) k = "label";
      else k = "metric";
      out.push({ t, k });
    }
    else if (op) out.push({ t, k: "op" });
    else if (punct) {
      if (punct === "{") depth++;
      if (punct === "}") depth = Math.max(0, depth - 1);
      out.push({ t, k: "punct" });
    }
    else out.push({ t, k: "" });
  }
  // Grouping lists like "by (instance)" are labels, not metrics.
  for (let i = 0; i < out.length; i++) {
    if (out[i].k === "kw" && /^(by|without|on|ignoring|group_left|group_right)$/.test(out[i].t)) {
      let j = i + 1;
      while (j < out.length && out[j].t.trim() === "") j++;
      if (out[j]?.t === "(") {
        for (j++; j < out.length && out[j].t !== ")"; j++) if (out[j].k === "metric") out[j].k = "label";
      }
    }
  }
  return out;
}
function highlight(src) {
  return tokenize(src).map(tok => tok.k && tok.k !== "punct" ? `<span class="tk-${tok.k}">${esc(tok.t)}</span>` : esc(tok.t)).join("");
}
function queryMetrics(a) {
  return uniq(queriesOf(a).filter(q => has(q.expr)).flatMap(q => {
    if (q.language === "logql") { const sel = q.expr.match(/\{[^}]*\}/); return sel ? [sel[0]] : []; }
    return tokenize(q.expr).filter(t => t.k === "metric").map(t => t.t);
  }));
}

/**
 * Duplicate detection. Two rules are "similar" when they read the same series filtered the same way —
 * identical metric set (or log selector) and near-identical label matchers / line filters — so they would
 * fire on the same underlying condition, differing only in threshold, window or severity.
 */
function matcherSet(a) {
  const out = new Set();
  for (const q of queriesOf(a)) {
    const toks = tokenize(q.expr || "").filter(t => t.t.trim() !== "");
    for (let i = 0; i + 2 < toks.length; i++) {
      const [x, op, v] = toks.slice(i, i + 3);
      if (/^(label|metric)$/.test(x.k) && /^(=|!=|=~|!~)$/.test(op.t) && v.k === "str") out.add(`${x.t}${op.t}${v.t}`);
    }
    for (let i = 0; i + 1 < toks.length; i++) {
      if (/^(\|=|\|~|!=|!~)$/.test(toks[i].t) && toks[i + 1].k === "str" && q.language === "logql") out.add(`${toks[i].t}${toks[i + 1].t}`);
    }
  }
  return out;
}
function jaccard(x, y) {
  if (!x.size && !y.size) return 1;
  let inter = 0; for (const v of x) if (y.has(v)) inter++;
  return inter / (x.size + y.size - inter);
}
function findSimilar(alerts) {
  const info = alerts.map(a => ({ metrics: [...queryMetrics(a)].sort().join("|"), matchers: matcherSet(a) }));
  const pairs = [];
  for (let i = 0; i < alerts.length; i++) for (let j = i + 1; j < alerts.length; j++) {
    if (!info[i].metrics || info[i].metrics !== info[j].metrics) continue;
    const score = jaccard(info[i].matchers, info[j].matchers);
    if (score >= 0.8) pairs.push({ a: alerts[i], b: alerts[j], score, sharedMetrics: queryMetrics(alerts[i]) });
  }
  return pairs.sort((p, q) => q.score - p.score);
}
function similarVerdict(p) {
  if (p.a.severity !== p.b.severity) return `Different severities (${p.a.severity} / ${p.b.severity}) — likely escalation tiers of one signal; confirm thresholds or windows differ.`;
  return "Same severity — consolidate, or document why both exist.";
}

/** Time from the condition first becoming true to the rule entering FIRING. */
function firingTiming(a) {
  const iv = parseDur(a.evaluation?.interval), pend = parseDur(a.evaluation?.pendingDuration) ?? 0;
  if (iv === null) return null;
  // Pending starts at the first breaching evaluation, which happens up to one interval after the breach.
  return { min: pend, max: pend + iv, pend, iv };
}

/* ---------------------------------------------------------------
   State + hash router
   #/<view>[/alert/<id>][?q=..&severity=a,b&sort=col:dir]
   --------------------------------------------------------------- */
const VIEWS = [
  { key: "overview", label: "Overview" },
  { key: "alerts",   label: "Alerts" },
  { key: "services", label: "Services" },
  { key: "health",   label: "Documentation Health" }
];
const state = {
  view: "overview",
  alert: null,
  q: "",
  filters: Object.fromEntries(FILTERS.map(f => [f.key, new Set()])),
  sort: { col: "severity", dir: "asc" },
  expanded: new Set()
};

function stateToHash() {
  let h = `#/${state.view}`;
  if (state.alert) h += `/alert/${encodeURIComponent(state.alert)}`;
  const p = new URLSearchParams();
  if (state.q) p.set("q", state.q);
  for (const f of FILTERS) if (state.filters[f.key].size) p.set(f.key, [...state.filters[f.key]].join(","));
  if (state.sort.col !== "severity" || state.sort.dir !== "asc") p.set("sort", `${state.sort.col}:${state.sort.dir}`);
  const qs = p.toString();
  return qs ? `${h}?${qs}` : h;
}
function hashToState(hash) {
  const [path, qs = ""] = hash.replace(/^#\/?/, "").split("?");
  const seg = path.split("/").filter(Boolean);
  state.view = VIEWS.some(v => v.key === seg[0]) ? seg[0] : "overview";
  state.alert = seg[1] === "alert" && BY_ID.has(decodeURIComponent(seg[2] || "")) ? decodeURIComponent(seg[2]) : null;
  const p = new URLSearchParams(qs);
  state.q = p.get("q") || "";
  for (const f of FILTERS) state.filters[f.key] = new Set((p.get(f.key) || "").split(",").filter(Boolean));
  const [col, dir] = (p.get("sort") || "severity:asc").split(":");
  state.sort = { col: COLUMNS.some(c => c.key === col) ? col : "severity", dir: dir === "desc" ? "desc" : "asc" };
}
let lastHash = "";
/** push=true adds a history entry (navigation); otherwise the current entry is replaced (typing, filtering). */
function commit({ push = false } = {}) {
  const h = stateToHash();
  if (h !== location.hash) {
    lastHash = h;
    try {
      if (push) history.pushState(null, "", h); else history.replaceState(null, "", h);
    } catch {
      // sandboxed/opaque origin: history API throws; fragment navigation still works
      if (push) location.hash = h; else location.replace(h);
    }
  }
  render();
}
// Fragment navigation fires both popstate and hashchange; only react to URLs we did not write ourselves.
function onUrlChange() {
  if (location.hash === lastHash) return;
  lastHash = location.hash;
  hashToState(location.hash);
  $("#q").value = state.q;
  render();
}
window.addEventListener("hashchange", onUrlChange);
window.addEventListener("popstate", onUrlChange);

function filtered() {
  const q = state.q.trim().toLowerCase();
  const terms = q ? q.split(/\s+/) : [];
  return MODEL.filter(a => {
    for (const f of FILTERS) {
      const sel = state.filters[f.key];
      if (sel.size && !sel.has(f.get(a))) return false;
    }
    return terms.every(t => a._search.includes(t));
  });
}
function activeFilterCount() { return FILTERS.reduce((n, f) => n + state.filters[f.key].size, 0) + (state.q ? 1 : 0); }

/** Navigate to the Alerts view with an exact filter set (used by dashboard cards and charts). */
function goAlerts(filters = {}) {
  for (const f of FILTERS) state.filters[f.key] = new Set(filters[f.key] || []);
  state.q = "";
  state.view = "alerts";
  state.alert = null;
  $("#q").value = "";
  commit({ push: true });
}
function goHealth(section) {
  state.view = "health"; state.alert = null; commit({ push: true });
  if (section) requestAnimationFrame(() => $(`#health-${section}`)?.scrollIntoView({ block: "center" }));
}

function sorted(list) {
  const col = COLUMNS.find(c => c.key === state.sort.col) || COLUMNS[2];
  const dir = state.sort.dir === "desc" ? -1 : 1;
  return [...list].sort((a, b) => {
    const x = col.sort(a), y = col.sort(b);
    return (x < y ? -1 : x > y ? 1 : 0) * dir || SEV_RANK[a.severity] - SEV_RANK[b.severity] || a.name.localeCompare(b.name);
  });
}
function filterControl(f) {
  const sel = state.filters[f.key];
  const values = uniq(MODEL.map(f.get)).sort((a, b) => (a === NONE) - (b === NONE) || (f.order ? f.order(a) - f.order(b) : String(a).localeCompare(b)));
  const summary = sel.size === 0 ? `${f.label}: All` : sel.size === 1 ? `${f.label}: ${fmtFilterVal(f, [...sel][0])}` : `${f.label} (${sel.size})`;
  return `<details class="ms ${sel.size ? "active" : ""}" data-filter="${f.key}">
    <summary>${esc(summary)} <svg width="10" height="10" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 8h16l-8 9z"/></svg></summary>
    <div class="ms-pop" role="group" aria-label="${esc(f.label)} filter">
      ${values.map(v => `<label><input type="checkbox" value="${esc(v)}" ${sel.has(v) ? "checked" : ""}>
        <span class="${v === NONE ? "none" : ""}">${esc(fmtFilterVal(f, v))}</span><span class="n">${MODEL.filter(a => f.get(a) === v).length}</span></label>`).join("")}
      <div class="ms-actions"><button type="button" class="link-btn" data-ms-all>Select all</button><button type="button" class="link-btn" data-ms-clear>Clear</button></div>
    </div></details>`;
}
function cellFor(a, key) {
  switch (key) {
    case "name": return `<div class="name-cell"><a href="#" data-open="${esc(a.id)}">${esc(a.name)}</a><span class="uid">${esc(a.grafana?.uid || "")}</span></div>`;
    case "status": return C.status(a.enabled);
    case "severity": return C.sev(a.severity) + (a._sevIssue ? ` <span title="${esc(a._sevIssue)}" style="color:var(--missing)">${ICON.alertTri}</span>` : "");
    case "service": return has(a.service) ? esc(a.service) : `<span class="note">—</span>`;
    case "group": return `<span class="mono">${esc(a.grafana?.group || "—")}</span>`;
    case "datasource": return esc(a.datasource || "—");
    case "interval": return `<span class="mono">${esc(a.evaluation?.interval || "—")}</span>`;
    case "for": return `<span class="mono">${esc(a.evaluation?.pendingDuration || "—")}</span>`;
    case "links": return C.miniLinks(a);
    case "doc": return C.doc(a._doc);
  }
  return "";
}
function expandRow(a) {
  return `<tr class="expand-row"><td colspan="${COLUMNS.length + 1}"><div class="expand-body">
    <div><h4>Fires when</h4><p>${C.val(a.summary, "summary")}</p>
      <h4>Impact</h4><p>${C.val(a.impact, "impact")}</p></div>
    <div><h4>Condition</h4><p><code>${esc(conditionText(a) || "—")}</code><br><span class="note">for ${esc(a.evaluation?.pendingDuration || "0s")}, evaluated every ${esc(a.evaluation?.interval || "—")}</span></p>

function viewAlerts() {
  const list = sorted(filtered());
  const chips = [];
  if (state.q) chips.push(`<span class="chip">Search: “${esc(state.q)}”<button type="button" data-unchip="q" aria-label="Remove search">${ICON.close}</button></span>`);
  for (const f of FILTERS) for (const v of state.filters[f.key]) chips.push(`<span class="chip">${esc(f.label)}: ${esc(fmtFilterVal(f, v))}<button type="button" data-unchip="${f.key}" data-v="${esc(v)}" aria-label="Remove filter">${ICON.close}</button></span>`);
  return `

  <div class="filterbar">

    <button type="button" class="icon-btn clear-btn" id="clear-filters" ${activeFilterCount() ? "" : "disabled"}>Clear filters</button>
    <span class="result-meta" aria-live="polite"><b>${list.length}</b> of ${MODEL.length} alerts</span>
  </div>

      <thead><tr><th style="width:34px"><span class="visually-hidden">Expand</span></th>
        ${COLUMNS.map(c => `<th aria-sort="${state.sort.col === c.key ? (state.sort.dir === "asc" ? "ascending" : "descending") : "none"}">
          <button type="button" data-sort="${c.key}">${esc(c.label)}<span class="sort">${state.sort.col === c.key ? (state.sort.dir === "asc" ? "▲" : "▼") : "↕"}</span></button></th>`).join("")}</tr></thead>
      <tbody>
        ${list.length ? list.map(a => `
          <tr class="row sev-row-${a.severity} ${a.enabled ? "" : "is-disabled"} ${state.alert === a.id ? "is-open" : ""}" data-row="${esc(a.id)}">
            <td><button type="button" class="expander" data-expand="${esc(a.id)}" aria-expanded="${state.expanded.has(a.id)}" aria-label="Expand ${esc(a.name)}">${ICON.chevron}</button></td>
            ${COLUMNS.map(c => `<td>${cellFor(a, c.key)}</td>`).join("")}
          </tr>${state.expanded.has(a.id) ? expandRow(a) : ""}`).join("")
        : `<tr><td colspan="${COLUMNS.length + 1}"><div class="empty">No alerts match these filters. <button type="button" class="link-btn" id="clear-filters-2">Clear filters</button></div></td></tr>`}
      </tbody>
    </table></div></div>`;
}
let reopen = null, reopenValue = null;
function bindAlerts(root) {
  $$(".ms", root).forEach(d => {
    const f = FILTER_BY_KEY[d.dataset.filter];
    d.addEventListener("toggle", () => { if (d.open) $$(".ms[open]").forEach(o => o !== d && (o.open = false)); });
    $$("input[type=checkbox]", d).forEach(cb => cb.addEventListener("change", () => {
      cb.checked ? state.filters[f.key].add(cb.value) : state.filters[f.key].delete(cb.value);
      reopen = f.key; reopenValue = cb.value; commit();
    }));
    $("[data-ms-all]", d).addEventListener("click", () => { $$("input", d).forEach(cb => state.filters[f.key].add(cb.value)); reopen = f.key; commit(); });
    $("[data-ms-clear]", d).addEventListener("click", () => { state.filters[f.key].clear(); reopen = f.key; commit(); });
  });
  if (reopen) {
    const d = $(`.ms[data-filter="${reopen}"]`, root);
    if (d) { d.open = true; $$("input", d).find(i => i.value === reopenValue)?.focus(); }
    reopen = null; reopenValue = null;
  }
  const clear = () => { for (const f of FILTERS) state.filters[f.key].clear(); state.q = ""; $("#q").value = ""; commit(); };
  $("#clear-filters", root)?.addEventListener("click", clear);
  $("#clear-filters-2", root)?.addEventListener("click", clear);
  $$("[data-unchip]", root).forEach(b => b.addEventListener("click", () => {
    if (b.dataset.unchip === "q") { state.q = ""; $("#q").value = ""; } else state.filters[b.dataset.unchip].delete(b.dataset.v);
    commit();
  }));
  $$("[data-sort]", root).forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.sort;
    state.sort = state.sort.col === k ? { col: k, dir: state.sort.dir === "asc" ? "desc" : "asc" } : { col: k, dir: "asc" };
    commit();
  }));
  $$("[data-expand]", root).forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const id = b.dataset.expand;
    state.expanded.has(id) ? state.expanded.delete(id) : state.expanded.add(id);
    render();
  }));
  $$("tr.row", root).forEach(tr => tr.addEventListener("click", e => {
    if (e.target.closest("a,button,input,summary")) return;
    openAlert(tr.dataset.row);
  }));
}

  <div class="panel" style="margin-bottom:16px">

    ${qs.length ? qs.map(q => C.code(q.expr, q.language || "promql", `refId ${q.refId} · ${q.datasource}${q.range ? ` · range ${q.range}` : ""}`)).join("") : '<span class="note">none</span>'}
    ${(a.expressions || []).length ? `<h4>Expressions</h4>${cfgRows(a.expressions.map(e => [`${e.refId} · ${e.type}`,
      (e.type === "reduce" ? `<code>${esc(e.reducer)}(${esc(e.expression)})</code>${e.mode ? ` <span class="note">mode ${esc(e.mode)}</span>` : ""}`
        : e.type === "threshold" ? `<code>${esc(e.expression)} ${esc(evaluatorText(e))}</code>`
        : `<code>${esc(e.expression || "")}</code>`) + (e.refId === a.grafana?.condition ? ' <span class="badge tag">alert condition</span>' : "")]))}` : ""}`);

  const edge = (text, val) => `<div class="lc-edge"><div class="t">${text}</div>${val ? `<div class="v">${esc(val)}</div>` : ""}<div class="arrow"></div></div>`;
  const s3 = sec("lifecycle", "3", "Alert lifecycle", `
    <div class="lifecycle" role="img" aria-label="Alert state lifecycle from Normal to Resolved">
      <div class="lc-state normal"><b>NORMAL</b><small>checked every ${esc(ev.interval || "?")}</small></div>
      ${edge("Condition true", cond)}
      ${pendingSec > 0 ? `<div class="lc-state pending"><b>PENDING</b><small>timer started</small></div>
      ${edge("Condition stays true for", ev.pendingDuration)}` : edge("No pending period — fires on first breach", "for 0s")}
      <div class="lc-state firing"><b>FIRING</b><small>${esc(a.severity)}</small></div>
      ${edge(`Condition recovers${keepSec ? " + keep firing" : ""}`, keepSec ? ev.keepFiringFor : "")}
      <div class="lc-state resolved"><b>RESOLVED</b><small>back to normal</small></div>
    </div>
    <div class="timing">
      ${t ? `<b>Condition true → FIRING:</b> ${fmtDur(t.min)} – ${fmtDur(t.max)}
        <span class="note">(pending ${fmtDur(t.pend)} + up to one evaluation interval ${fmtDur(t.iv)})</span><br>` : ""}
      <b>No data:</b> goes to <code>${esc(ev.noData || "—")}</code> · <b>query error:</b> goes to <code>${esc(ev.execError || "—")}</code>.
      ${keepSec ? `<br><b>On recovery:</b> stays FIRING for another ${esc(ev.keepFiringFor)} to prevent flapping, then resolves.` : ""}
      ${!a.enabled ? `<br><b style="color:var(--missing)">This rule is paused — it is not evaluated and none of this happens.</b>` : ""}
    </div>`);

  const s4 = sec("impact", "4", "Impact", has(a.impact)
    ? `<div class="impact-grid"><div class="ignored"><div class="k">Impact (from the rule's description annotation)</div>${esc(a.impact)}</div></div>`
    : C.missing("impact statement (description annotation)"));

  const s5 = sec("response", "5", "Response", `
    <h4>Do now</h4>
    ${has(a.doNow) ? `<ol class="steps first">${a.doNow.map(s => `<li>${md(s)}</li>`).join("")}</ol>` : C.missing("do-now steps")}
    <h4>Resolved when</h4>
    ${has(a.resolvedWhen) ? `<div class="condition" style="font-size:13.5px">${md(a.resolvedWhen)}</div>` : C.missing("resolved-when criteria")}
    <h4>Runbook</h4>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${C.link(a.links?.runbook, "Runbook", "book")}${C.link(a.links?.dashboard, "Dashboard", "dash")}</div>`,
    has(a.links?.runbook) ? "" : `<span class="badge gap-badge">${ICON.alertTri}No runbook</span>`);

  const s6 = sec("links", "6", "Links", cfgRows([
    ["Dashboard", has(a.links?.dashboard) ? extLink(a.links.dashboard) : C.missing("dashboard link")],
    ["Runbook", has(a.links?.runbook) ? extLink(a.links.runbook) : C.missing("runbook_url")],
    ["Grafana rule", has(a.grafana?.url) ? extLink(a.grafana.url) : "—"]
  ]));

  const chainNode = (k, v, d, cls = "") => `<div class="node ${cls}"><div class="k">${esc(k)}</div><div class="v">${has(v) ? esc(v) : "—"}</div>${d ? `<div class="d">${esc(d)}</div>` : ""}</div>`;
  const link = `<div class="link" aria-hidden="true">${ICON.arrow}</div>`;
  const logql = qs.some(q => q.language === "logql");
  const sims = SIMILAR.filter(p => p.a === a || p.b === a);
  const s7 = sec("dependencies", "7", "Alert dependencies", `
    <p class="note">How telemetry becomes this alert.</p>
    <div class="chain">
      ${chainNode("Service label", a.service || "(none)", "")}${link}
      ${chainNode(logql ? "Log stream" : "Metric(s)", a._metrics.join(", "), logql ? "log selector" : "")}${link}
      ${chainNode("Data source", a.datasource, uniq(qs.map(q => (q.language || "promql").toUpperCase())).join(", "))}${link}
      ${chainNode("Grafana alert", a.name, `${a.grafana?.folder || ""} / ${a.grafana?.group || ""}`, "self")}
    </div>
    ${sims.length ? `<h4>Similar alerts</h4><ul>${sims.map(p => { const other = p.a === a ? p.b : p.a; return `<li>${C.alertLink(other)} <span class="note">${Math.round(p.score * 100)}% identical filters on ${p.sharedMetrics.map(esc).join(", ")} — ${esc(similarVerdict(p))}</span></li>`; }).join("")}</ul>` : ""}`);

  const s8 = sec("config", "8", "Configuration", `
    ${cfgRows([
      { group: "Identity" },
      ["Grafana alert UID", mono(a.grafana?.uid)], ["Folder", esc(a.grafana?.folder || "—")], ["Rule group", mono(a.grafana?.group)], ["Rule name", esc(a.name)],
      ["Paused", a.enabled ? "No" : "<b>Yes</b>"],
      { group: "Evaluation" },
      ["Queries", qs.length ? qs.map(q => `<code>${esc(q.refId)}</code> ${esc((q.language || "promql").toUpperCase())} on ${esc(q.datasource)}`).join("<br>") + ' <span class="note">(full text in section 2)</span>' : "—"],
      ["Expressions", (a.expressions || []).map(e => `<code>${esc(e.refId)}</code> ${esc(e.type)}`).join(" → ") || "—"],
      ["Condition", cond ? `<code>${esc(a.grafana?.condition || "")}</code>: <code>${esc(cond)}</code>` : "—"],
      ["Evaluation interval", mono(ev.interval)], ["Pending duration", mono(ev.pendingDuration)], ["Keep firing duration", mono(ev.keepFiringFor)],
      ["No data / error state", `${mono(ev.noData)} / ${mono(ev.execError)}`],
      { group: "Metadata" },
      ["Labels", C.labels(a.labels)],
      ["Annotations", Object.keys(a.annotations || {}).length ? cfgRows(Object.entries(a.annotations).map(([k, v]) => [k, `<code>${esc(v)}</code>`])) : '<span class="note">none</span>']
    ])}
    <details class="raw-toggle"><summary>View raw configuration</summary>
      <p class="note" style="margin-top:8px">The rule exactly as it appears in the Grafana export (with its group, folder and interval).</p>
      ${a.raw ? C.code(JSON.stringify(a.raw, null, 2), "json", "Grafana rule export") : '<span class="note">not available</span>'}
    </details>`);

  const s9 = sec("docs", "9", "Documentation quality", `
    <p>${C.doc(a._doc)} &nbsp;${a._doc.present.length} of ${DOC_REQUIREMENTS.length} fields present.</p>
    <div class="doc-reqs">${DOC_REQUIREMENTS.map(r => r.test(a) ? `<div class="good">${ICON.check}${esc(r.label)}</div>` : `<div class="bad">${ICON.cross}${esc(r.label)} — missing</div>`).join("")}</div>
    ${a._sevIssue ? `<p style="margin-top:10px"><span class="badge gap-badge">${ICON.alertTri}Unclear severity</span> ${esc(a._sevIssue)}</p>` : ""}`);

  return `
  <div class="drawer-head">
    <div class="drawer-title">
      <h2 id="drawer-title">${esc(a.name)}</h2>
      <div class="actions">
        <button type="button" class="icon-btn" id="copy-link" title="Copy link to this alert">${ICON.link}<span>Copy link</span></button>
        <button type="button" class="icon-btn" id="drawer-close" aria-label="Close alert details (Esc)" title="Close (Esc)">${ICON.close}</button>
      </div>
    </div>
    <div class="drawer-badges">${C.sev(a.severity)}${C.status(a.enabled)}${has(a.service) ? `<span class="badge tag">${esc(a.service)}</span>` : ""}<span class="badge tag mono">${esc(a.grafana?.group || "")}</span>${C.doc(a._doc)}<span class="badge tag mono">${esc(a.grafana?.uid || "")}</span></div>
    <nav class="drawer-nav" aria-label="Alert sections">${DRAWER_SECTIONS.map(s => `<a href="#sec-${s.id}" data-jump="${s.id}" class="${sectionGap(a, s.id) ? "gap" : ""}">${esc(s.label)}</a>`).join("")}</nav>
  </div>
  <div class="drawer-body" id="drawer-body">${summary}${s1}${s2}${s3}${s4}${s5}${s6}${s7}${s8}${s9}</div>`;
}

let lastFocus = null;
function openAlert(id) {
  if (!BY_ID.has(id)) return;
  lastFocus = document.activeElement;
  state.alert = id;
  commit({ push: true });
}
function closeAlert() {
  state.alert = null;
  commit({ push: true });
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function renderDrawer() {
  const dr = $("#drawer"), scrim = $("#scrim");
  const a = state.alert && BY_ID.get(state.alert);
  if (!a) {
    dr.hidden = true; scrim.hidden = true; dr.dataset.id = ""; document.body.style.overflow = "";
    return;
  }
  if (dr.dataset.id !== a.id) {
    dr.innerHTML = drawerHTML(a);
    dr.dataset.id = a.id;
    $("#drawer-close", dr).addEventListener("click", closeAlert);
    $("#copy-link", dr).addEventListener("click", () => copyText(location.href.split("#")[0] + stateToHash(), "Link copied"));
    $$("[data-jump]", dr).forEach(l => l.addEventListener("click", e => {
      e.preventDefault();
      $(`#sec-${l.dataset.jump}`, dr)?.scrollIntoView({ block: "start" });
    }));
    dr.hidden = false; scrim.hidden = false;
    document.body.style.overflow = "hidden";
    $("#drawer-body", dr).scrollTop = 0;
    $("#drawer-close", dr).focus({ preventScroll: true });
  }
}

/* ---------------------------------------------------------------
   Clipboard (with fallbacks for sandboxed frames)
   --------------------------------------------------------------- */
function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}
function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch { ok = false; }
  ta.remove();
  return ok;
}
async function copyText(text, msg = "Copied", btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch { ok = legacyCopy(text); }
  if (ok) {
    toast(msg);
    if (btn) { const html = btn.innerHTML; btn.classList.add("done"); btn.innerHTML = `${ICON.check}Copied`; setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = html; }, 1500); }
  } else {
    const pre = btn?.closest(".code")?.querySelector("pre");
    if (pre) { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast("Clipboard blocked here — text selected, press Ctrl+C");
  }
}

/* ---------------------------------------------------------------
   Theme
   --------------------------------------------------------------- */
function currentTheme() {
  const saved = store.getItem("grafana-alerts-theme");
  if (saved === "light" || saved === "dark") return saved;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  const b = $("#theme-btn");
  b.innerHTML = t === "dark" ? ICON.sun : ICON.moon;
  b.setAttribute("aria-label", t === "dark" ? "Switch to light theme" : "Switch to dark theme");
}

/* ---------------------------------------------------------------
   Render + global events
   --------------------------------------------------------------- */
function renderNav() {
  const debt = MODEL.filter(a => a._doc.status !== "complete").length;
  const counts = { alerts: MODEL.length, services: uniq(MODEL.map(a => a.service || NONE)).length, health: debt };
  $("#nav").innerHTML = VIEWS.map(v => `<a href="#/${v.key}" data-view="${v.key}" ${state.view === v.key ? 'aria-current="page"' : ""}>${esc(v.label)}${counts[v.key] !== undefined ? ` <span class="count ${v.key === "health" && debt ? "bad" : ""}">${counts[v.key]}</span>` : ""}</a>`).join("");
}
function render() {
  renderNav();
  const main = $("#view");
  const scroll = window.scrollY;
  main.innerHTML = { overview: viewOverview, alerts: viewAlerts, services: viewServices, health: viewHealth }[state.view]();
  if (state.view === "overview") bindOverview(main);
  if (state.view === "alerts") bindAlerts(main);
  if (main.dataset.view === state.view) window.scrollTo(0, scroll);
  main.dataset.view = state.view;
  renderDrawer();
}
function renderSourceBanner() {
  const d = new Date(DATA_SOURCE.exportedAt);
  const when = isNaN(d) ? esc(DATA_SOURCE.exportedAt) : d.toISOString().slice(0, 16).replace("T", " ") + " UTC";
  $("#source-banner").innerHTML = `<div><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="flex:none;margin-top:2px;color:var(--warn)"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm0 6 1 7h-2l1-7Zm0 9.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg>
    <span><strong>${esc(titleCase(DATA_SOURCE.environment))} Grafana</strong> — ${MODEL.length} rules exported from
    <a href="${esc(DATA_SOURCE.grafanaUrl)}/alerting/list" target="_blank" rel="noopener">${esc(DATA_SOURCE.grafanaUrl.replace(/^https?:\/\//, ""))}</a> on ${when}.
    A static snapshot of the rule definitions, not live alert state. Only what the rule export contains is shown; impact, do-now and resolved-when text come from each rule's <code>description</code> annotation.</span></div>`;
}

document.addEventListener("click", e => {
  const open = e.target.closest("[data-open]");
  if (open) { e.preventDefault(); openAlert(open.dataset.open); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) { copyText(copy.dataset.copy, "Copied to clipboard", copy); return; }
  const go = e.target.closest("[data-go]");
  if (go) { goAlerts(JSON.parse(go.dataset.go)); return; }
  const hc = e.target.closest("[data-health]");
  if (hc) { goHealth(HEALTH_TARGET[hc.dataset.health] || hc.dataset.health); return; }
  const nav = e.target.closest("[data-view]");
  if (nav) { e.preventDefault(); state.view = nav.dataset.view; state.alert = null; commit({ push: true }); window.scrollTo(0, 0); return; }
  if (e.target.id === "scrim") { closeAlert(); return; }
  if (!e.target.closest(".ms")) $$(".ms[open]").forEach(d => (d.open = false));
});
document.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === "Escape") {
    if ($$(".ms[open]").length) { $$(".ms[open]").forEach(d => (d.open = false)); return; }
    if (state.alert) { closeAlert(); return; }
    if (typing) document.activeElement.blur();
  }
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  // Keep keyboard focus inside the open drawer.
  if (e.key === "Tab" && state.alert) {
    const f = $$('#drawer a[href], #drawer button, #drawer summary, #drawer [tabindex]:not([tabindex="-1"])').filter(el => el.offsetParent !== null);
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    else if (!$("#drawer").contains(document.activeElement)) { e.preventDefault(); f[0].focus(); }
  }
});
$("#q").addEventListener("input", e => {
  state.q = e.target.value;
  if (state.view !== "alerts") { state.view = "alerts"; state.alert = null; }
  commit();
});
$("#q").addEventListener("keydown", e => {
  if (e.key === "Enter") { const list = filtered(); if (list.length === 1) openAlert(list[0].id); }
});
$("#theme-btn").addEventListener("click", () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  try { store.setItem("grafana-alerts-theme", t); } catch { /* storage unavailable */ }
  applyTheme(t);
});

applyTheme(currentTheme());
renderSourceBanner();
hashToState(location.hash);
lastHash = location.hash;
$("#q").value = state.q;
render();
})();
</script>
</body>
