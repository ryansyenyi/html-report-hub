<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Service Health Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --border: #e2e5ea;
    --accent: #2f6feb;
    --good: #1a9e6b;
    --warn: #c98a1a;
    --bad: #d1425a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f26;
      --text: #e8eaf0;
      --muted: #9aa1b0;
      --border: #2b2f38;
      --accent: #6ea1ff;
      --good: #4fd39a;
      --warn: #ecb75f;
      --bad: #ff8098;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  button {
    font: inherit;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .stat { flex: 1; min-width: 120px; }
  .stat .num { font-size: 1.5rem; font-weight: 600; }
  .stat .label { color: var(--muted); font-size: 0.8rem; }
  .refreshed { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
  svg { width: 100%; height: 220px; display: block; }
  .bar { fill: var(--accent); opacity: 0.55; }
  .line { fill: none; stroke: var(--accent); stroke-width: 2; }
  .dot { fill: var(--accent); }
  .grid-line { stroke: var(--border); stroke-width: 1; }
  .axis-label { fill: var(--muted); font-size: 10px; font-family: inherit; }
</style>
</head>
<body>
  <h1>Service Health Dashboard</h1>
  <p class="sub">Narya &middot; synthetic latency &amp; throughput sample (fictional data)</p>

  <div class="panel">
    <div class="toolbar">
      <button data-range="24h" class="active">24h</button>
      <button data-range="7d">7d</button>
      <button data-range="30d">30d</button>
      <span class="refreshed">Last refreshed: <span id="refreshed-at">just now</span></span>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="num" id="stat-p50">--</div><div class="label">p50 latency (ms)</div></div>
      <div class="stat"><div class="num" id="stat-p99">--</div><div class="label">p99 latency (ms)</div></div>
      <div class="stat"><div class="num" id="stat-rps">--</div><div class="label">req/sec</div></div>
      <div class="stat"><div class="num" id="stat-err">--</div><div class="label">error rate</div></div>
    </div>

    <svg id="chart" viewBox="0 0 640 220" preserveAspectRatio="none"></svg>
  </div>

  <script>
    (function () {
      var SVG_NS = 'http://www.w3.org/2000/svg';
      var chart = document.getElementById('chart');
      var refreshedEl = document.getElementById('refreshed-at');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('button[data-range]'));

      var seeds = { '24h': 7, '7d': 42, '30d': 99 };
      var pointCounts = { '24h': 24, '7d': 7, '30d': 30 };

      function mulberry32(seed) {
        return function () {
          seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
          var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function genSeries(range) {
        var rand = mulberry32(seeds[range]);
        var n = pointCounts[range];
        var base = 80;
        var bars = [];
        var line = [];
        for (var i = 0; i < n; i++) {
          var latency = base + rand() * 60 + Math.sin(i / 3) * 10;
          var throughput = 200 + rand() * 150;
          bars.push(throughput);
          line.push(latency);
        }
        return { bars: bars, line: line };
      }

      function clearSvg() {
        while (chart.firstChild) chart.removeChild(chart.firstChild);
      }

      function el(tag, attrs) {
        var node = document.createElementNS(SVG_NS, tag);
        for (var k in attrs) node.setAttribute(k, attrs[k]);
        return node;
      }

      function render(range) {
        var data = genSeries(range);
        clearSvg();

        var w = 640, h = 220, padding = 24;
        var maxBar = Math.max.apply(null, data.bars);
        var maxLine = Math.max.apply(null, data.line);
        var minLine = Math.min.apply(null, data.line);
        var n = data.bars.length;
        var slot = (w - padding * 2) / n;

        for (var g = 0; g < 4; g++) {
          var gy = padding + g * ((h - padding * 2) / 3);
          chart.appendChild(el('line', {
            x1: padding, x2: w - padding, y1: gy, y2: gy, class: 'grid-line',
          }));
        }

        for (var i = 0; i < n; i++) {
          var barH = (data.bars[i] / maxBar) * (h - padding * 2) * 0.7;
          var x = padding + i * slot + slot * 0.15;
          chart.appendChild(el('rect', {
            x: x.toFixed(1), y: (h - padding - barH).toFixed(1),
            width: (slot * 0.7).toFixed(1), height: barH.toFixed(1),
            class: 'bar',
          }));
        }

        var points = [];
        for (var j = 0; j < n; j++) {
          var norm = (data.line[j] - minLine) / Math.max(1, maxLine - minLine);
          var lx = padding + j * slot + slot / 2;
          var ly = h - padding - norm * (h - padding * 2) * 0.85;
          points.push(lx.toFixed(1) + ',' + ly.toFixed(1));
        }
        chart.appendChild(el('polyline', { points: points.join(' '), class: 'line' }));
        points.forEach(function (p) {
          var parts = p.split(',');
          chart.appendChild(el('circle', { cx: parts[0], cy: parts[1], r: 2.5, class: 'dot' }));
        });

        chart.appendChild(el('text', { x: padding, y: h - 6, class: 'axis-label' })).textContent =
          range === '24h' ? '24h ago' : range === '7d' ? '7d ago' : '30d ago';
        chart.appendChild(el('text', { x: w - padding, y: h - 6, class: 'axis-label', 'text-anchor': 'end' })).textContent = 'now';

        var avgLatency = data.line.reduce(function (a, b) { return a + b; }, 0) / n;
        var p99 = Math.max.apply(null, data.line);
        var avgThroughput = data.bars.reduce(function (a, b) { return a + b; }, 0) / n;
        var errRate = (Math.max(0.1, 3 - n / 10)).toFixed(2);

        document.getElementById('stat-p50').textContent = avgLatency.toFixed(0);
        document.getElementById('stat-p99').textContent = p99.toFixed(0);
        document.getElementById('stat-rps').textContent = avgThroughput.toFixed(0);
        document.getElementById('stat-err').textContent = errRate + '%';
      }

      buttons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          buttons.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          render(btn.getAttribute('data-range'));
        });
      });

      var seconds = 0;
      setInterval(function () {
        seconds += 1;
        refreshedEl.textContent = seconds + 's ago';
      }, 1000);

      render('24h');
    })();
  </script>
</body>
</html>
